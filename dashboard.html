<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | طلباتي نمبر</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/portal.css"><style>.dash{max-width:1100px;margin:40px auto;padding:20px}.panel{background:#11182b;border:1px solid #29334c;border-radius:16px;padding:20px;margin:16px 0;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.grid select,.grid input{width:100%;padding:12px;border-radius:10px;border:1px solid #39445f;background:#0b1020;color:white}.order{padding:12px;border-bottom:1px solid #29334c}.muted{color:#9eabc5}.action{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#7c5cff;color:#fff;font-weight:700}</style></head><body class="portal-body"><div class="dash"><header class="portal-nav"><a class="brand" href="/">طلباتي نمبر</a><button id="logout" class="action">تسجيل الخروج</button></header><h1>مرحباً بك في حسابك</h1><div class="grid"><section class="panel"><div class="muted">رصيد محفظتك</div><h2 id="balance">—</h2><small>USD</small></section><section class="panel"><div class="muted">الحساب</div><strong id="identity">جارٍ التحميل...</strong></section></div><section class="panel"><h2>شراء رقم جديد</h2><div class="grid"><div><label>الخدمة</label><select id="service"><option value="tg">تليجرام</option><option value="wa">واتساب</option></select></div><div><label>الدولة</label><select id="country"><option>اختر الخدمة أولاً</option></select></div></div><p id="country-info" class="muted">الأسعار بالدولار وتُعرض بعد اختيار الخدمة.</p><button class="action" id="buy">شراء الرقم</button><p id="message" role="status"></p></section><section class="panel"><h2>طلباتي</h2><div id="orders">جارٍ التحميل...</div></section><section class="panel"><h2>سجل المحفظة</h2><div id="transactions" class="muted">جارٍ التحميل...</div><p class="muted">الشحن الإلكتروني غير مفعّل بعد؛ لا تشحن قبل إعلان وسائل الدفع الرسمية.</p></section></div><script src="/dashboard.js"></script></body></html>
