<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b18"><title>إنشاء حساب تاجر | RafidPay"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 15%,#183b56,transparent 36%),radial-gradient(ellipse at 90% 5%,#33245c,transparent 34%),#090d1b;color:#f6f7ff;font:14px/1.9 Alexandria,system-ui}.wrap{width:min(760px,calc(100% - 28px));margin:auto}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font-weight:800;font-size:20px;color:white;text-decoration:none}.brand b{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(140deg,#b39aff,#5968df);margin-left:8px}.back{color:#c5b5ff;text-decoration:none}.card{margin:34px 0 55px;padding:30px;border:1px solid #ffffff20;border-radius:24px;background:#141b30ed;box-shadow:0 25px 80px #0006}.eyebrow{color:#bba8ff}.card h1{font-size:30px;margin:4px 0}.sub{color:#aab3c9;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}label{display:block;margin:13px 0 6px;font-weight:600}input,select{width:100%;height:52px;border:1px solid #34405e;border-radius:12px;background:#090f20;color:#fff;padding:0 13px;font:inherit}input:focus,select:focus{outline:none;border-color:#a58aff;box-shadow:0 0 0 3px #a58aff25}.btn{width:100%;border:0;border-radius:13px;padding:15px;margin-top:23px;background:linear-gradient(105deg,#9466f3,#4daed9);color:white;font:700 15px Alexandria}.note{display:none;padding:12px;margin-top:15px;border-radius:12px;background:#2b251e;color:#f1d59b;border:1px solid #665638}.note.show{display:block}.tiny{font-size:11px;color:#8e9ab4;margin-top:13px}@media(max-width:580px){.card{padding:22px 17px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card h1{font-size:25px}}
</style></head><body><header class="wrap nav"><a class="brand" href="/rafidpay"><b>R</b>RafidPay</a><a class="back" href="/rafidpay/login">لدي حساب؟ تسجيل الدخول ←</a></header><main class="wrap"><section class="card"><div class="eyebrow">إنشاء حساب جديد · بوابة التجار</div><h1>ابدأ رحلتك كتاجر</h1><p class="sub">أدخل بياناتك وبيانات نشاطك التجاري. في الخطوة التالية سنطلب توثيق هويتك قبل تفعيل الحساب.</p><form id="reg"><div class="grid">
<div class="full"><label>الاسم الكامل لصاحب الحساب</label><input id="name" autocomplete="name" required minlength="5" placeholder="الاسم كما في البطاقة الشخصية"></div>
<div><label>رقم الهاتف</label><input id="phone" type="tel" autocomplete="tel" required placeholder="+9677XXXXXXXX"></div>
<div><label>البريد الإلكتروني (اختياري)</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div class="full"><label>اسم النشاط التجاري / المتجر</label><input id="business" required minlength="2" placeholder="اسم متجرك أو شركتك"></div>
<div><label>الدولة</label><select id="country"><option value="YE">اليمن</option><option value="SA">السعودية</option><option value="IQ">العراق</option><option value="AE">الإمارات</option><option value="EG">مصر</option><option value="JO">الأردن</option></select></div>
<div><label>المدينة / المحافظة</label><input id="city" required placeholder="مثال: إب"></div>
<div class="full"><label>العنوان التفصيلي للنشاط</label><input id="address" required minlength="5" placeholder="الحي، الشارع، وأقرب معلم"></div>
<div class="full"><label>كلمة المرور (10 أحرف على الأقل)</label><input id="password" type="password" minlength="10" required autocomplete="new-password" placeholder="أنشئ كلمة مرور قوية"></div>
</div><button class="btn" id="submit">إنشاء الحساب والانتقال لتوثيق الهوية ←</button><div id="note" class="note" role="status"></div></form><p class="tiny">بإنشاء الحساب، توافق على مراجعة بيانات النشاط والهوية من إدارة RafidPay. لا تشارك كلمة المرور مع أي شخص.</p></section></main>
<script>
const $=id=>document.getElementById(id),form=$("reg"),btn=$("submit"),note=$("note");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;btn.textContent="جارٍ إنشاء الحساب...";note.classList.remove("show");try{const email=$("email").value.trim(),phone=$("phone").value.trim();if(!email&&!phone)throw Error("أدخل رقم الهاتف أو البريد الإلكتروني على الأقل.");const reg=await fetch("/api/register",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,phone,password:$("password").value})});const rd=await reg.json().catch(()=>({}));if(!reg.ok)throw Error(rd.error||"تعذر إنشاء الحساب");const m=await fetch("/api/rafidpay/merchant",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({owner_full_name:$("name").value.trim(),owner_phone:phone,business_name:$("business").value.trim(),country_code:$("country").value,business_address:$("address").value.trim()})});const md=await m.json().catch(()=>({}));if(!m.ok)throw Error(md.message||md.error||"تم إنشاء الحساب لكن تعذر إنشاء ملف التاجر. سجّل الدخول وأكمل بيانات التاجر.");sessionStorage.setItem("rafidpay_onboarding_city",$("city").value.trim());location.replace("/rafidpay/verify");}catch(err){note.textContent=err.message;note.classList.add("show");btn.disabled=false;btn.textContent="إنشاء الحساب والانتقال لتوثيق الهوية ←";}});
</script></body></html>
