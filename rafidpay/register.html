<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>إنشاء حساب تاجر | RafidPay</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020!important;color:#f7f7ff!important;font-family:Tahoma,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#183650 0,transparent 38%),radial-gradient(ellipse at 90% 5%,#302354 0,transparent 35%),#0b1020!important}.wrap{width:min(700px,calc(100% - 28px));margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20}.brand{font-size:21px;font-weight:bold;color:#fff;text-decoration:none}.brand b{display:inline-grid;place-items:center;background:linear-gradient(135deg,#a88aff,#5869dc);width:42px;height:42px;border-radius:14px;margin-left:8px}.top a:last-child{color:#c7b8ff;text-decoration:none}.card{margin:28px auto 48px;padding:26px 22px;border:1px solid #ffffff24;border-radius:22px;background:#151c30;box-shadow:0 20px 60px #0008}.tag{color:#b9a5ff;font-size:13px}h1{font-size:27px;margin:8px 0 5px}.desc{color:#b8c0d3;line-height:1.8;margin:0 0 18px}.field{margin:14px 0}label{display:block;font-weight:bold;margin:0 0 7px}input,select{display:block;width:100%;height:52px;padding:0 14px;border:1px solid #394562;border-radius:12px;background:#0b1224;color:#fff;font:16px Tahoma,Arial,sans-serif}input::placeholder{color:#818ba2}input:focus,select:focus{outline:2px solid #9d7aff;border-color:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.submit{width:100%;min-height:56px;margin-top:16px;border:0;border-radius:13px;background:linear-gradient(100deg,#9565ed,#4aaedb);color:white;font-size:17px;font-weight:bold}.submit:disabled{opacity:.6}.note{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#352b20;color:#ffe0a3;line-height:1.7}.note.show{display:block}.hint{color:#929db4;font-size:12px;line-height:1.8;margin-top:14px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:23px 17px}h1{font-size:24px}}
</style></head>
<body>
<header class="wrap top"><a class="brand" href="/rafidpay"><b>R</b>RafidPay</a><a href="/rafidpay/login">لدي حساب؟ تسجيل الدخول ←</a></header>
<main class="wrap"><section class="card">
<div class="tag">إنشاء حساب جديد · بوابة التجار</div><h1>ابدأ رحلتك كتاجر</h1>
<p class="desc">أدخل بياناتك وبيانات نشاطك التجاري. بعد إنشاء الحساب ستنتقل إلى صفحة توثيق الهوية.</p>
<form id="reg">
<div class="grid">
<div class="field full"><label for="name">الاسم الكامل لصاحب الحساب</label><input id="name" autocomplete="name" required minlength="5" placeholder="الاسم كما في البطاقة الشخصية"></div>
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" autocomplete="tel" required placeholder="+9677XXXXXXXX"></div>
<div class="field"><label for="email">البريد الإلكتروني (اختياري)</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div class="field full"><label for="business">اسم النشاط التجاري / المتجر</label><input id="business" required minlength="2" placeholder="اسم متجرك أو شركتك"></div>
<div class="field"><label for="country">الدولة</label><select id="country"><option value="YE">اليمن</option><option value="SA">السعودية</option><option value="IQ">العراق</option><option value="AE">الإمارات</option><option value="EG">مصر</option><option value="JO">الأردن</option></select></div>
<div class="field"><label for="city">المدينة / المحافظة</label><input id="city" required placeholder="مثال: إب"></div>
<div class="field full"><label for="address">العنوان التفصيلي للنشاط</label><input id="address" required minlength="5" placeholder="الحي، الشارع، وأقرب معلم"></div>
<div class="field full"><label for="password">كلمة المرور (10 أحرف على الأقل)</label><input id="password" type="password" minlength="10" required autocomplete="new-password" placeholder="أنشئ كلمة مرور قوية"></div>
</div>
<button class="submit" id="submit" type="submit">إنشاء الحساب والانتقال لتوثيق الهوية ←</button><div id="note" class="note" role="status"></div>
</form><p class="hint">سيتم مراجعة بيانات النشاط والهوية من إدارة RafidPay قبل تفعيل حساب التاجر. لا تشارك كلمة المرور مع أي شخص.</p>
</section></main>
<script>
(()=>{const $=id=>document.getElementById(id),form=$("reg"),btn=$("submit"),note=$("note");form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;btn.textContent="جارٍ إنشاء الحساب...";note.className="note";note.textContent="";try{const email=$("email").value.trim(),phone=$("phone").value.trim();if(!email&&!phone)throw Error("أدخل رقم الهاتف أو البريد الإلكتروني.");const reg=await fetch("/api/register",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,phone,password:$("password").value})});const rd=await reg.json().catch(()=>({}));if(!reg.ok)throw Error(rd.message||(rd.error==="RATE_LIMITED"?"تم تجاوز عدد محاولات التسجيل مؤقتاً. انتظر دقيقة ثم حاول مجدداً.":rd.error)||"تعذر إنشاء الحساب.");const m=await fetch("/api/rafidpay/merchant",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({owner_full_name:$("name").value.trim(),owner_phone:phone,business_name:$("business").value.trim(),country_code:$("country").value,business_address:$("address").value.trim()})});const md=await m.json().catch(()=>({}));if(!m.ok)throw Error(md.message||md.error||"تعذر حفظ بيانات التاجر. حاول تسجيل الدخول ثم أكمل البيانات.");sessionStorage.setItem("rafidpay_onboarding_city",$("city").value.trim());location.href="/rafidpay/verify";}catch(err){note.textContent=err.message;note.className="note show";btn.disabled=false;btn.textContent="إنشاء الحساب والانتقال لتوثيق الهوية ←";}});})();
</script></body></html>
