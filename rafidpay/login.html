<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b18">
<title>دخول التاجر | RafidPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b18;--line:#2b3552;--text:#f6f7ff;--muted:#aab3c9;--purple:#a58aff;--cyan:#56c8e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 18%,#183b56 0,transparent 36%),radial-gradient(ellipse at 90% 5%,#33245c 0,transparent 34%),linear-gradient(145deg,#080b18,#0d1225 60%,#081321);color:var(--text);font:15px/1.9 Alexandria,system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 34px));margin:auto}.nav{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14}.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;text-decoration:none;color:var(--text)}.mark{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#b39aff,#5968df);font-size:24px;box-shadow:0 8px 25px #8262f555}.brand small{display:block;color:#8f99b3;font:10px/1.2 system-ui;letter-spacing:3px}.back{color:#c1b3ff;text-decoration:none;font-size:13px}.main{min-height:calc(100vh - 135px);display:grid;place-items:center;padding:45px 0}.card{width:min(520px,100%);padding:36px;border:1px solid #ffffff1d;border-radius:28px;background:linear-gradient(150deg,#171d32ee,#111729ee);box-shadow:0 28px 90px #0007;position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#7759ef20;filter:blur(55px);top:-130px;left:-100px}.markbig{width:66px;height:66px;border-radius:21px;display:grid;place-items:center;background:linear-gradient(145deg,#b39aff,#5968df);font-size:34px;font-weight:800;position:relative}.eyebrow{color:#bba8ff;font-size:13px;margin-top:25px;position:relative}.card h1{font-size:clamp(32px,7vw,45px);line-height:1.35;margin:6px 0 7px;position:relative}.grad{background:linear-gradient(100deg,#c6a8ff,#67c9ef);background-clip:text;color:transparent}.desc{color:var(--muted);font-size:13px;margin:0 0 24px;position:relative}label{display:block;font-size:13px;font-weight:600;margin:15px 0 7px}input{width:100%;height:58px;border-radius:15px;padding:0 16px;background:#090f20;border:1px solid #303b58;color:#fff;font:inherit;outline:none}input:focus{border-color:#a38aff;box-shadow:0 0 0 4px #9470ff20}button{width:100%;height:59px;border:0;border-radius:15px;margin-top:23px;background:linear-gradient(105deg,#9466f3,#4daed9);color:white;font:700 15px Alexandria;cursor:pointer;box-shadow:0 12px 32px #7556e844}button:disabled{opacity:.6;cursor:wait}.note{display:none;margin-top:17px;padding:13px 15px;border:1px solid #65563a;background:#29251e;color:#f1d59b;border-radius:13px;font-size:12px}.note.show{display:block}.foot{text-align:center;color:#8f99b1;font-size:12px;margin-top:23px}.foot a{color:#bba8ff;text-decoration:none}.help{margin-top:15px;color:#8994ad;font-size:11px;text-align:center}@media(max-width:520px){.nav{height:75px}.card{padding:27px 21px;border-radius:23px}.main{padding:28px 0}.brand{font-size:19px}}
</style></head><body>
<header class="wrap nav"><a class="brand" href="/rafidpay"><span class="mark">R</span><span>RafidPay<small>MERCHANT PORTAL</small></span></a><a class="back" href="/rafidpay">العودة إلى بوابة الدفع ←</a></header>
<main class="wrap main"><section class="card"><div class="markbig">R</div><div class="eyebrow">مساحة التاجر · تسجيل دخول آمن</div><h1>مرحباً <span class="grad">بعودتك.</span></h1><p class="desc">سجّل الدخول بحسابك للوصول إلى لوحة التاجر وإدارة روابط الدفع ومفاتيح API.</p>
<form id="merchant-login"><label for="identity">رقم الهاتف أو البريد الإلكتروني</label><input id="identity" name="identity" autocomplete="username" placeholder="أدخل رقم الهاتف أو البريد الإلكتروني" required><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required><button id="submit" type="submit">تسجيل الدخول كتاجر ←</button><div id="note" class="note" role="status"></div></form>
<div class="foot">ليس لديك حساب؟ <a href="/rafidpay/register">إنشاء حساب تاجر جديد</a></div><div class="help">يتم استخدام حساب طلباتي لتسجيل الدخول، ثم تُفتح لك مساحة التاجر الخاصة ببوابة RafidPay.</div></section></main>
<script>
const form=document.getElementById("merchant-login"),btn=document.getElementById("submit"),note=document.getElementById("note");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;btn.textContent="جارٍ التحقق من البيانات...";note.classList.remove("show");try{const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({identity:document.getElementById("identity").value.trim(),password:document.getElementById("password").value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||"بيانات الدخول غير صحيحة");location.replace("/rafidpay/dashboard");}catch(err){note.textContent=err.message||"تعذر تسجيل الدخول، حاول مرة أخرى.";note.classList.add("show");btn.disabled=false;btn.textContent="تسجيل الدخول كتاجر ←";}});
</script></body></html>
