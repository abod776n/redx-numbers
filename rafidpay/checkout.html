<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدفع عبر إيصالات | RafidPay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,480px);background:#131c31;border:1px solid #293852;padding:25px;border-radius:18px;box-shadow:0 20px 60px #0005}h1{margin-top:0}.muted{color:#aab8ce}.amount{font-size:30px;font-weight:800;margin:16px 0;color:#67d5c2}label{display:block;margin-top:12px}input{width:100%;padding:13px;margin-top:6px;background:#091426;color:white;border:1px solid #34445f;border-radius:9px;font:inherit}button{width:100%;padding:14px;margin-top:18px;background:#67d5c2;border:0;border-radius:9px;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#status{margin-top:16px;line-height:1.7;white-space:pre-wrap}.safe{font-size:13px;color:#aab8ce;margin-top:16px}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#26354e;color:#c8d7ec;font-size:12px}
</style></head><body><main class="card">
<div class="tag">RafidPay · إيصالات</div><h1 id="title">جارٍ تحميل الفاتورة...</h1><p id="description" class="muted"></p><div id="amount" class="amount"></div>
<label for="name">اسمك (اختياري)</label><input id="name" maxlength="120" autocomplete="name">
<label for="email">البريد الإلكتروني (اختياري)</label><input id="email" type="email" maxlength="160" autocomplete="email">
<button id="pay" disabled>إنشاء طلب دفع حقيقي</button><div id="paymentDetails" hidden><p id="walletInfo"></p><p><a id="payUrl" target="_blank" rel="noopener" hidden>فتح صفحة الدفع لدى إيصالات</a></p><label for="reference">مرجع التحويل الذي ظهر في محفظتك</label><input id="reference" maxlength="128" autocomplete="off"><button id="sendReference" type="button">إرسال المرجع للتحقق</button></div><div id="status" role="status" aria-live="polite"></div>
<p class="safe">سيتم تأكيد الدفع من خادم إيصالات عبر إشعار موثّق. لا تغلق الصفحة حتى تظهر حالة الطلب، ولا ترسل كلمة مرور أو رمز تحقق لأي شخص.</p>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),slug=location.pathname.split("/").filter(Boolean).pop();let link=null,orderRef=null,polling=false;
async function getJson(url,options={}){const r=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||"تعذر إكمال الطلب");return d}
async function poll(ref){if(polling)return;polling=true;for(let i=0;i<120;i++){try{const d=await getJson("/api/rafidpay/public/orders/"+encodeURIComponent(ref));if(d.order.status==="paid"){$("status").textContent="✅ تم تأكيد الدفع بنجاح من إيصالات. رقم الطلب: "+ref;return}if(["failed","refunded"].includes(d.order.status)){$("status").textContent="تعذر إكمال الدفع. رقم الطلب: "+ref;return}}catch(e){}await new Promise(r=>setTimeout(r,3000));} $("status").textContent="لا يزال الطلب قيد التحقق. رقم الطلب: "+ref}
async function init(){try{const d=await getJson("/api/rafidpay/public/links/"+slug);link=d.payment_link;$("title").textContent=link.title;$("description").textContent=link.description||"";$("amount").textContent=link.amount+" "+link.currency;if(link.currency!=="YER"||!Number.isSafeInteger(Number(link.amount))){$("status").textContent="الدفع يتطلب مبلغاً صحيحاً بالريال اليمني.";return}$("pay").disabled=false;$("status").textContent="الدفع المباشر عبر إيصالات."}catch(e){$("title").textContent="تعذر تحميل رابط الدفع";$("status").textContent=e.message}}
$("pay").onclick=async()=>{if(!link)return;$("pay").disabled=true;$("status").textContent="جارٍ إنشاء طلب حقيقي لدى إيصالات...";try{const d=await getJson("/api/rafidpay/public/links/"+slug+"/create-order",{method:"POST",body:JSON.stringify({customer_name:$("name").value,customer_email:$("email").value})});orderRef=d.order.reference;$("paymentDetails").hidden=false;$("walletInfo").textContent="حوّل "+d.order.amount+" ريال إلى "+d.order.wallet.name+" — رقم الحساب: "+d.order.wallet.account_number;if(d.order.pay_url){$("payUrl").href=d.order.pay_url;$("payUrl").hidden=false}$("status").textContent="تم إنشاء طلب الدفع لدى إيصالات. بعد التحويل أدخل مرجع العملية أدناه.";poll(orderRef)}catch(e){$("status").textContent="فشل إنشاء طلب الدفع: "+e.message;$("pay").disabled=false}};
$("sendReference").onclick=async()=>{if(!orderRef)return;const reference=$("reference").value.trim();if(!reference){$("status").textContent="أدخل مرجع التحويل أولاً.";return}$("sendReference").disabled=true;try{const d=await getJson("/api/rafidpay/public/orders/"+encodeURIComponent(orderRef)+"/reference",{method:"POST",body:JSON.stringify({reference})});$("status").textContent="تم إرسال المرجع إلى إيصالات. حالة الطلب: "+(d.status||"PENDING")+" — رقم الطلب: "+orderRef;}catch(e){$("status").textContent="تعذر إرسال المرجع: "+e.message;}finally{$("sendReference").disabled=false}};
init();})();
</script>
<script>
(()=>{const $=id=>document.getElementById(id),slug=location.pathname.split("/").filter(Boolean).pop();let link=null,client=null,orderRef=null,polling=false;
async function getJson(url,options={}){const r=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||"تعذر إكمال الطلب");return d}
async function poll(ref){if(polling)return;polling=true;$("status").textContent="تم إرسال نتيجة صفحة الدفع. ننتظر تأكيد إيصالات من الخادم...";for(let i=0;i<60;i++){try{const d=await getJson("/api/rafidpay/public/orders/"+encodeURIComponent(ref));if(d.order.status==="paid"){$("status").textContent="✅ تم تأكيد الدفع بنجاح من إيصالات. رقم الطلب: "+ref;return}if(["failed","refunded"].includes(d.order.status)){$("status").textContent="تعذر تأكيد العملية. تواصل مع المتجر واذكر رقم الطلب: "+ref;return}}catch(e){}await new Promise(r=>setTimeout(r,3000));}$("status").textContent="لا يزال الدفع قيد التحقق. احتفظ برقم الطلب وتواصل مع المتجر إذا تأخر التأكيد: "+ref}
async function init(){try{const [cfg,d]=await Promise.all([getJson("/api/rafidpay/public/config"),getJson("/api/rafidpay/public/links/"+slug)]);link=d.payment_link;$("title").textContent=link.title;$("description").textContent=link.description||"";$("amount").textContent=link.amount+" "+link.currency;if(link.currency!=="YER"||!Number.isSafeInteger(Number(link.amount))){$("status").textContent="هذا الرابط غير جاهز للدفع عبر إيصالات. يجب أن يكون المبلغ بالريال اليمني وبعدد صحيح.";return}if(!cfg.publishable_key){$("status").textContent="إعداد مفتاح SDK غير مكتمل. يرجى التواصل مع إدارة المتجر.";return}if(typeof window.EsaalatCheckout!=="function"){$("status").textContent="تعذر تحميل مكتبة الدفع. حدّث الصفحة أو حاول لاحقاً.";return}client=new window.EsaalatCheckout({publishableKey:cfg.publishable_key,locale:"ar",presentation:"modal"});$("pay").disabled=false;}catch(e){$("title").textContent="تعذر تحميل رابط الدفع";$("status").textContent=e.message}}
$("pay").onclick=async()=>{if(!client||!link)return;$("pay").disabled=true;$("status").textContent="جارٍ تجهيز طلب الدفع...";try{const created=await getJson("/api/rafidpay/public/links/"+slug+"/create-order",{method:"POST",body:JSON.stringify({customer_name:$("name").value,customer_email:$("email").value})});orderRef=created.order.reference;$("status").textContent="تم تجهيز الطلب "+orderRef+"، جارٍ فتح صفحة إيصالات...";const result=await client.open({amount:created.order.amount,currency:"YER",externalOrderId:orderRef});if(result&&result.status==="VERIFIED"){await poll(orderRef)}else if(result&&result.status){$("status").textContent="حالة صفحة الدفع: "+result.status+". لم يتم اعتماد العملية كمدفوعة حتى يصل تأكيد الخادم. رقم الطلب: "+orderRef;if(result.status==="PENDING")await poll(orderRef)}else{$("status").textContent="انتهت صفحة الدفع دون نتيجة نهائية. رقم الطلب: "+orderRef}}catch(e){$("status").textContent="تعذر بدء الدفع: "+(e.message||"خطأ غير معروف");}finally{$("pay").disabled=false}};
init();})();
</script></body></html>
