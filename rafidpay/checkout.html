<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدفع | RafidPay</title><style>body{background:#0b1020;color:#eef3ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(90%,440px);background:#131c31;padding:25px;border-radius:16px}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#091426;color:white;border:1px solid #34445f;border-radius:8px}button{width:100%;padding:13px;background:#67d5c2;border:0;border-radius:8px}small{color:#b6c2d7}</style><main class="card"><h1>RafidPay</h1><div id="info">جارٍ التحميل...</div><label>اسم العميل</label><input id="name"><label>البريد الإلكتروني</label><input id="email"><button id="pay">محاكاة دفع تجريبي</button><p><small>هذه عملية اختبار فقط، لا يتم خصم أو تحويل أي أموال حقيقية.</small></p><p id="result"></p></main><script>let slug=location.pathname.split("/").pop(),$=x=>document.getElementById(x);async function init(){let r=await fetch("/api/rafidpay/public/links/"+slug),d=await r.json();if(!r.ok){$("info").textContent="رابط الدفع غير صالح";$("pay").disabled=true;return}$("info").textContent=d.payment_link.title+" — "+(d.payment_link.description||"")+" — "+d.payment_link.amount+" "+d.payment_link.currency}$("pay").onclick=async()=>{let r=await fetch("/api/rafidpay/public/links/"+slug+"/sandbox-pay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_name:$("name").value,customer_email:$("email").value})}),d=await r.json();$("result").textContent=r.ok?"نجحت المحاكاة. المرجع: "+d.transaction.reference:(d.error||"تعذر التنفيذ")};init();</script>
