<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RafidPay</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:16px system-ui}.wrap{max-width:850px;margin:35px auto;padding:18px}.panel{background:#131c31;border:1px solid #293852;border-radius:14px;padding:22px;margin:16px 0}input,select{display:block;width:100%;box-sizing:border-box;margin:8px 0 15px;padding:12px;background:#091426;color:white;border:1px solid #34445f;border-radius:8px}button{padding:12px 18px;background:#67d5c2;border:0;border-radius:8px;font-weight:bold}a{color:#67d5c2;text-decoration:none}.muted{color:#aab8ce}</style><div class="wrap"><h1>RafidPay</h1><p class="muted">بوابة الدفع للتجار والمطورين</p><p><a href="/rafidpay/docs">وثائق API</a>　<a href="/">العودة إلى طلباتي</a></p><div class="panel"><h2>ملف التاجر</h2><p id="state">جارٍ التحقق من تسجيل الدخول...</p><label>اسم النشاط التجاري</label><input id="business" placeholder="اسم المتجر"><label>الدولة</label><select id="country"><option value="YE">اليمن</option><option value="SA">السعودية</option><option value="AE">الإمارات</option><option value="IQ">العراق</option></select><button id="register">إنشاء ملف تاجر</button></div><div class="panel"><h2>حالة المنصة</h2><p>وضع الاختبار Sandbox فقط. لا يتم تحصيل أموال حقيقية في هذه المرحلة.</p><p id="health"></p></div></div><script>const $=x=>document.getElementById(x);async function call(u,o){let r=await fetch(u,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},o||{})),d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تنفيذ الطلب");return d}async function init(){try{let d=await call("/api/rafidpay/merchant");$("state").textContent=d.merchant?"اسم النشاط: "+d.merchant.business_name+" — الحالة: "+d.merchant.status:"سجّل الدخول إلى طلباتي ثم أنشئ ملف تاجر.";if(d.merchant)$("register").disabled=true}catch(e){$("state").textContent="يجب تسجيل الدخول إلى حساب طلباتي أولاً."}try{let h=await call("/api/rafidpay/health");$("health").textContent="الخدمة متاحة — "+h.mode}catch(e){$("health").textContent="الخدمة غير متاحة مؤقتاً"}}$("register").onclick=async()=>{try{let d=await call("/api/rafidpay/merchant",{method:"POST",body:JSON.stringify({business_name:$("business").value,country_code:$("country").value})});$("state").textContent="تم إنشاء ملف التاجر. الحالة: "+d.merchant.status;$("register").disabled=true}catch(e){$("state").textContent=e.message}};init();</script>
