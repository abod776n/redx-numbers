<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RafidPay</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:16px system-ui}.wrap{max-width:900px;margin:30px auto;padding:18px}.panel{background:#131c31;border:1px solid #293852;border-radius:14px;padding:22px;margin:16px 0}input,select{display:block;width:100%;box-sizing:border-box;margin:8px 0 15px;padding:12px;background:#091426;color:white;border:1px solid #34445f;border-radius:8px}button{padding:12px 18px;background:#67d5c2;border:0;border-radius:8px;font-weight:bold;cursor:pointer}a{color:#67d5c2;text-decoration:none}.muted{color:#aab8ce}pre{direction:ltr;white-space:pre-wrap;overflow-wrap:anywhere;background:#091426;padding:12px;border-radius:8px}.row{display:flex;gap:10px}.row>*{flex:1}@media(max-width:650px){.row{display:block}}</style><main class="wrap"><h1>RafidPay</h1><p class="muted">بوابة الدفع للتجار والمطورين</p><p><a href="/rafidpay/docs">وثائق API</a>　<a href="/">العودة إلى طلباتي</a></p><div class="panel"><h2>ملف التاجر</h2><p id="state">جارٍ التحميل...</p><label>اسم النشاط التجاري</label><input id="business" placeholder="اسم المتجر"><label>الدولة</label><select id="country"><option value="YE">اليمن</option><option value="SA">السعودية</option><option value="AE">الإمارات</option><option value="IQ">العراق</option></select><button id="register">إنشاء ملف تاجر</button></div><section id="tools" hidden><div class="panel"><h2>مفتاح API</h2><button id="key">إنشاء مفتاح جديد</button><p id="keyout"></p><small>احفظ المفتاح فوراً، لن يظهر كاملاً مرة أخرى. لا تشاركه مع أحد.</small></div><div class="panel"><h2>إنشاء رابط دفع</h2><label>عنوان الطلب</label><input id="title" placeholder="فاتورة رقم 102"><label>الوصف</label><input id="desc" placeholder="اختياري"><div class="row"><div><label>المبلغ</label><input id="amount" type="number" min="0.01" step="0.01"></div><div><label>العملة</label><select id="currency"><option>USD</option><option>YER</option></select></div></div><button id="create">إنشاء الرابط</button><p id="linkout"></p></div><div class="panel"><h2>روابط الدفع</h2><button id="refresh">تحديث القائمة</button><div id="links"></div></div><div class="panel"><h2>آخر العمليات</h2><div id="tx"></div></div></section><p class="muted">الوضع الحالي Sandbox فقط. لا يتم تحصيل أموال حقيقية.</p></main><script>
const $=x=>document.getElementById(x);let apiKey=sessionStorage.getItem("rafidpay_key")||"";
async function call(url,opt){let r=await fetch(url,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opt||{})),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||"تعذر تنفيذ الطلب");return d}
async function init(){try{let d=await call("/api/rafidpay/merchant");if(!d.merchant){$("state").textContent="سجّل الدخول إلى طلباتي ثم أنشئ ملف تاجر.";return}$("state").textContent="النشاط: "+d.merchant.business_name+" — حالة الحساب: "+d.merchant.status;if(d.merchant.status==="active"){$("tools").hidden=false;await refresh()}else $("state").textContent+=" — ينتظر مراجعة الإدارة."}catch(e){$("state").textContent="يجب تسجيل الدخول إلى حساب طلباتي أولاً."}}
$("register").onclick=async()=>{try{let d=await call("/api/rafidpay/merchant",{method:"POST",body:JSON.stringify({business_name:$("business").value,country_code:$("country").value})});$("state").textContent="تم إنشاء الحساب. الحالة: "+d.merchant.status+" — ينتظر تفعيل الإدارة.";$("register").disabled=true}catch(e){$("state").textContent=e.message}};
$("key").onclick=async()=>{try{let d=await call("/api/rafidpay/keys",{method:"POST",body:JSON.stringify({name:"Merchant API"})});apiKey=d.api_key;sessionStorage.setItem("rafidpay_key",apiKey);$("keyout").textContent=apiKey;await refresh()}catch(e){$("keyout").textContent=e.message}};
async function api(url,opt){if(!apiKey)throw Error("أنشئ مفتاح API أولاً");return call(url,Object.assign({},opt||{},{headers:Object.assign({"Authorization":"Bearer "+apiKey},opt&&opt.headers||{})}))}
$("create").onclick=async()=>{try{let d=await api("/api/rafidpay/v1/payment-links",{method:"POST",body:JSON.stringify({title:$("title").value,description:$("desc").value,amount:Number($("amount").value),currency:$("currency").value})});$("linkout").textContent=d.payment_link.url;await refresh()}catch(e){$("linkout").textContent=e.message}};
async function refresh(){if(!apiKey){$("links").textContent="أنشئ مفتاح API لعرض الروابط والعمليات.";return}try{let a=await api("/api/rafidpay/v1/payment-links"),b=await api("/api/rafidpay/v1/transactions");$("links").textContent=a.payment_links.map(x=>x.title+" — "+x.amount+" "+x.currency+" — /rafidpay/pay/"+x.slug).join("\n")||"لا توجد روابط";$("tx").textContent=b.transactions.map(x=>x.reference+" — "+x.amount+" "+x.currency+" — "+x.status).join("\n")||"لا توجد عمليات"}catch(e){$("links").textContent=e.message}}
$("refresh").onclick=refresh;init();
</script>
