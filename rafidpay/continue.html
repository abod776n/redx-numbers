<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>إكمال حساب التاجر | RafidPay"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#183650,transparent 38%),radial-gradient(ellipse at 90% 5%,#302354,transparent 35%),#0b1020;color:#f7f7ff;font:16px/1.9 Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);padding:28px;border:1px solid #ffffff24;border-radius:22px;background:#151c30;text-align:center}.mark{margin:auto;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#a88aff,#5869dc);font-size:30px;font-weight:bold}h1{font-size:26px;margin:18px 0 6px}.muted{color:#b8c0d3;font-size:14px}.msg{margin-top:18px;padding:13px;border-radius:12px;background:#0d2630;color:#b5e9f3}.btn{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:12px;background:linear-gradient(100deg,#9565ed,#4aaedb);color:white;text-decoration:none;font-weight:bold}</style></head><body><main class="card"><div class="mark">R</div><h1>إكمال تسجيل التاجر</h1><p class="muted">نربط حسابك الحالي في طلباتي بملف التاجر في RafidPay، دون إنشاء حساب مكرر.</p><div id="msg" class="msg">جارٍ التحقق من تسجيل الدخول...</div></main><script>
(async()=>{const box=document.getElementById("msg");try{const auth=await fetch("/api/rafidpay/merchant",{credentials:"same-origin",cache:"no-store"});if(auth.status===401){location.replace("/rafidpay/login?next=%2Frafidpay%2Fcontinue");return;}const data=await auth.json();const saved=sessionStorage.getItem("rafidpay_pending_merchant");if(!saved){if(data.merchant){location.replace(data.merchant.status==="active"?"/rafidpay/dashboard":"/rafidpay/verify");return;}throw Error("لم نعثر على بيانات التسجيل المحفوظة. أعد إدخال بيانات النشاط.");}const p=JSON.parse(saved);if(data.merchant){sessionStorage.removeItem("rafidpay_pending_merchant");location.replace("/rafidpay/verify");return;}const r=await fetch("/api/rafidpay/merchant",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({owner_full_name:p.full_name,owner_phone:p.phone,business_name:p.business_name,country_code:p.country_code,business_address:p.address})});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==409)throw Error(d.message||d.error||"تعذر حفظ ملف التاجر.");sessionStorage.setItem("rafidpay_onboarding_city",p.city);sessionStorage.removeItem("rafidpay_pending_merchant");location.replace("/rafidpay/verify");}catch(e){box.textContent=e.message;}})();
</script></body></html>
