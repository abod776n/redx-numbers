<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>إكمال تسجيل التاجر | RafidPay">
<style>
*{box-sizing:border-box}html,body{margin:0!important;min-height:100%!important;background:#0b1020!important;color:#f7f7ff!important;font-family:Tahoma,Arial,sans-serif!important}body{min-height:100vh!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:22px!important;background:radial-gradient(ellipse at 15% 10%,#183650 0,transparent 38%),radial-gradient(ellipse at 90% 5%,#302354 0,transparent 35%),#0b1020!important}.card{width:min(540px,100%);padding:28px 22px;border:1px solid #ffffff28;border-radius:22px;background:#151c30!important;text-align:center;box-shadow:0 20px 60px #0008}.mark{margin:auto;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#a88aff,#5869dc);font-size:30px;font-weight:bold}h1{font-size:25px;margin:18px 0 6px;color:#fff}.muted{color:#b8c0d3;font-size:14px;line-height:1.9}.msg{margin-top:18px;padding:14px;border-radius:12px;background:#0d2630;color:#b5e9f3;line-height:1.9;overflow-wrap:anywhere}.msg.error{background:#35251f;color:#ffe0a3}.btn{display:inline-block;margin:14px 5px 0;padding:12px 20px;border-radius:12px;background:linear-gradient(100deg,#9565ed,#4aaedb);color:white;text-decoration:none;font-weight:bold}.btn.secondary{background:#29344e;border:1px solid #ffffff25}
</style></head><body><main class="card"><div class="mark">R</div><h1>إكمال تسجيل التاجر</h1><p class="muted">نجهز حسابك في بوابة RafidPay وننقلك إلى خطوة توثيق الهوية.</p><div id="msg" class="msg" role="status">جارٍ التحقق من حسابك...</div><div id="actions"></div></main>
<script>
(async function(){
const box=document.getElementById("msg"),actions=document.getElementById("actions");
function showError(message,login){box.textContent=message;box.className="msg error";actions.innerHTML=login?'<a class="btn" href="/rafidpay/login?next=%2Frafidpay%2Fcontinue">تسجيل الدخول مجدداً</a>':'<a class="btn" href="/rafidpay/register">العودة للتسجيل</a>';}
try{
 const response=await fetch("/api/rafidpay/merchant",{credentials:"same-origin",cache:"no-store"});
 if(response.status===401){showError("انتهت جلسة الدخول. سجّل الدخول بحساب طلباتي لإكمال التوثيق.",true);return;}
 const data=await response.json();
 const saved=sessionStorage.getItem("rafidpay_pending_merchant");
 if(data.merchant){sessionStorage.removeItem("rafidpay_pending_merchant");box.textContent="تم العثور على ملف التاجر. جارٍ فتح صفحة توثيق الهوية...";location.href="/rafidpay/verify";return;}
 if(!saved){showError("لم نعثر على بيانات النشاط المحفوظة. ارجع إلى التسجيل وأكمل البيانات.");return;}
 const p=JSON.parse(saved);
 const created=await fetch("/api/rafidpay/merchant",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({owner_full_name:p.full_name,owner_phone:p.phone,business_name:p.business_name,country_code:p.country_code,business_address:p.address})});
 const result=await created.json().catch(()=>({}));
 if(!created.ok&&created.status!==409){showError(result.message||result.error||"تعذر إنشاء ملف التاجر. أعد المحاولة.");return;}
 sessionStorage.setItem("rafidpay_onboarding_city",p.city||"");
 sessionStorage.removeItem("rafidpay_pending_merchant");
 box.textContent="تم حفظ بيانات التاجر. جارٍ فتح صفحة رفع الهوية...";
 location.href="/rafidpay/verify";
}catch(error){showError("تعذر إكمال الخطوة: "+(error.message||"خطأ غير معروف"),false);}
})();
</script></body></html>
