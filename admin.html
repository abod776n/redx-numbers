<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة طلباتي نمبر</title><link rel="stylesheet" href="/style.css"><style>body{background:#090d19;color:#eef2ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:16px}.panel{background:#141c30;border:1px solid #2b3650;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{padding:10px;border-radius:8px;border:1px solid #46516a;background:#0b1222;color:#fff}.btn{background:#7358ed;color:white;border:0;padding:11px 18px;border-radius:9px;cursor:pointer}.item{padding:10px;border-bottom:1px solid #303a51}.muted{color:#aab6cf}</style></head><body><main class="wrap"><header class="row" style="justify-content:space-between;align-items:center"><h1>لوحة إدارة طلباتي نمبر</h1><a href="/">زيارة الموقع ↗</a></header><p id="notice" class="muted">التحقق من صلاحيات المدير...</p><section class="panel"><h2>ملخص المنصة</h2><div class="row"><div>العملاء: <b id="customers">—</b></div><div>الطلبات: <b id="orders-count">—</b></div><div>المبيعات المكتملة: <b id="sales">—</b></div><div>رصيد المزوّد: <b id="provider">—</b></div></div></section><section class="panel"><h2>هامش الربح</h2><div class="row"><input id="markup" type="text" inputmode="decimal" autocomplete="off" value="10" aria-label="نسبة هامش الربح من صفر إلى خمسين"><button class="btn" id="save-markup">حفظ النسبة %</button></div></section><section class="panel"><h2>شحن محفظة عميل (يدوي)</h2><div class="row"><input id="uid" placeholder="رقم حساب العميل"><input id="amount" type="number" min="0.01" step="0.01" placeholder="المبلغ بالدولار"><button class="btn" id="credit">إضافة الرصيد</button></div><small class="muted">لا تستخدم هذه العملية إلا بعد التحقق من استلام المبلغ فعلياً.</small></section><section class="panel"><h2>العملاء</h2><div id="users">—</div></section><section class="panel"><h2>آخر الطلبات</h2><div id="orders">—</div></section><button class="btn" id="logout">تسجيل الخروج</button></main><script src="/admin.js"></script></body></html>
