<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تهيئة المدير الأول</title><style>body{background:#090d19;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(440px,92vw);background:#141c30;padding:24px;border-radius:16px}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;background:#0b1222;color:white;border:1px solid #46516a;border-radius:8px}button{padding:12px 18px;background:#7358ed;color:white;border:0;border-radius:8px;width:100%}</style></head><body><form class="card" id="f"><h2>إنشاء حساب المدير الأول</h2><p>هذه الخطوة لمرة واحدة. أدخل رمز التهيئة الذي ستضعه في متغير ADMIN_SETUP_TOKEN على Railway.</p><input id="token" placeholder="رمز التهيئة" required><input id="email" type="email" placeholder="بريد المدير" required><input id="password" type="password" minlength="14" placeholder="كلمة مرور قوية (14 حرفاً على الأقل)" required><button>إنشاء المدير</button><p id="msg"></p></form><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const d={setupToken:token.value,email:email.value,password:password.value};try{const r=await fetch("/api/admin/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.error);msg.textContent="تم إنشاء المدير. انتقل لتسجيل الدخول.";setTimeout(()=>location.href="/login.html",1500)}catch(x){msg.textContent=x.message}}</script></body></html>
