<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | طلباتي نمبر</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/portal.css"></head><body class="portal-body"><div class="noise"></div><main class="auth-wrap"><section class="auth-card"><a class="brand" href="/">طلباتي نمبر</a><div class="eyebrow">إنشاء حساب جديد</div><h1>انضم إلى <span class="grad">طلباتي</span></h1><form id="register-form"><label>البريد الإلكتروني (اختياري إذا أدخلت الهاتف)</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label>رقم الهاتف (اختياري إذا أدخلت البريد)</label><input id="phone" autocomplete="tel" placeholder="+967..."><label>كلمة المرور</label><input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="10 أحرف على الأقل"><button class="btn auth-submit" type="submit">إنشاء الحساب ←</button><div class="form-note" id="note" role="status"></div></form><div class="auth-bottom"><a href="/login.html">لديك حساب؟ تسجيل الدخول</a></div></section></main><script src="/register.js"></script></body></html>
